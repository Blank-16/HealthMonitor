services:
  redis:
    image: redis:8.6.2-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - monitoring

  server:
    build: ./server
    ports:
      - "5000:5000"
    environment:
      - REDIS_URL=redis://redis:6379
      - PORT=5000
      - MONITOR_INTERVAL=60000
      - URLS_TO_MONITOR=https://google.com,https://github.com,https://openai.com
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:5000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - monitoring

  client:
    build: ./client
    ports:
      - "3000:80"
    depends_on:
      server:
        condition: service_healthy
    networks:
      - monitoring

networks:
  monitoring:
    driver: bridge
