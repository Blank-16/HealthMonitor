version: '3.8'

services:
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    networks:
      - monitoring

  server:
    build: ./server
    ports:
      - "5000:5000"
    environment:
      - REDIS_URL=redis://redis:6379
      - PORT=5000
      - MONITOR_INTERVAL=60000
      - URLS_TO_MONITOR=https://google.com,https://github.com,https://openai.com
    depends_on:
      - redis
    networks:
      - monitoring

  client:
    build: ./client
    ports:
      - "3000:80"
    depends_on:
      - server
    networks:
      - monitoring

networks:
  monitoring:
    driver: bridge
